<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">

  <header class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-6">
        <div class="flex items-center">
          <h1 class="text-3xl font-bold text-gray-900">PlayStore</h1>
        </div>
        <nav class="hidden md:flex space-x-8 items-center">
          <a href="/home" class="text-gray-700 hover:text-blue-600 font-medium">Главная</a>
          <a href="/products" class="text-gray-700 hover:text-blue-600 font-medium">Товары</a>
          
          @if (user$ | async; as user) {
            <div class="flex items-center space-x-4">
              <span class="text-gray-700">Привет, {{ user?.displayName || user?.email }}!</span>
              <button
                (click)="logout()"
                class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                Выйти
              </button>
            </div>
          } @else {
            <a href="/login" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
              Войти
            </a>
          }
        </nav>
      </div>
    </div>
  </header>

  <section class="py-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h2 class="text-5xl font-bold text-gray-900 mb-6">
        Добро пожаловать в <span class="text-blue-600">PlayStore</span>
      </h2>
      <p class="text-xl text-gray-600 mb-8 max-w-2xl mx-auto">
        Откройте для себя лучшие игры и приложения в нашем магазине. 
        Качественный контент по доступным ценам.
      </p>
      <div class="flex justify-center space-x-4">
        <a href="/products" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition font-medium">
          Смотреть товары
        </a>
        <a href="/login" class="border border-blue-600 text-blue-600 px-8 py-3 rounded-lg hover:bg-blue-50 transition font-medium">
          Регистрация
        </a>
      </div>
    </div>
  </section>
