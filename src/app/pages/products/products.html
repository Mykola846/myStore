<div class="min-h-screen bg-gray-50">

  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <h1 class="text-3xl font-bold text-gray-900">Наши товары</h1>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let product of products" class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">

        <img [src]="product.poster" [alt]="product.title" class="w-full h-48 object-cover">
        
        <div class="p-6">
          <h3 class="text-xl font-semibold text-gray-900 mb-2">{{ product.title }}</h3>
          <p class="text-gray-600 mb-2">{{ product.developer }}</p>
          <p class="text-sm text-gray-500 mb-4">{{ product.description }}</p>
          
          <div class="flex flex-wrap gap-2 mb-4">
            <span *ngFor="let tag of product.tags" class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full">
              {{ tag }}
            </span>
          </div>
          
          <div class="flex justify-between items-center">
            <span class="text-2xl font-bold text-green-600">{{ product.price }}</span>
            <span class="text-sm text-gray-500">{{ product.reviews }}</span>
          </div>
          
          <button class="w-full mt-4 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition">
            Купить
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
